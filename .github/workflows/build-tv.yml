name: Build YTXTube TV

# Compila YTXTube (v2.1.0, commit fijo del repo original) con un parche para Android TV / Fire TV:
#  - inicio en cuadricula (2-4 columnas) en lugar de una tarjeta gigante
#  - los cuadros de ajustes reciben el foco del control remoto
#  - una sola parada de foco por tarjeta de video
#  - se instala junto a la app original (id com.tensei.ytxtube.tv)
# Resultado: release "tv-latest" con el archivo YTXTube-TV.apk (para Downloader).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar codigo original
        uses: actions/checkout@v4
        with:
          repository: Koustubh12345/YTXTube
          ref: 15ad04036173bb3c81f67b45b68cf5b761e7218a
          path: src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true'

      - name: Aplicar parche de TV
