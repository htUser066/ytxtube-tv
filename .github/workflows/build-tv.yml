      - name: Compilar APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/release/app-release.apk YTXTube-TV.apk
          ls -l YTXTube-TV.apk
          gh release delete tv-latest -R "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create tv-latest YTXTube-TV.apk -R "${{ github.repository }}" \
            --title "YTXTube TV" \
            --notes "YTXTube 2.1.0 con parche para Android TV / Fire TV (uso personal)." \
            --latest
          echo "Descarga: https://github.com/${{ github.repository }}/releases/download/tv-latest/YTXTube-TV.apk"
